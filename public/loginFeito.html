<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel</title>

     <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #555;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.2s;
        }

        a:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>
    <h1>Login realizado com sucesso!</h1>
    <p>Bem-vindo ao painel. Se chegou aqui, o login funcionou corretamente.</p>

    <a href="login.html">Sair</a>
</body>
</html>
