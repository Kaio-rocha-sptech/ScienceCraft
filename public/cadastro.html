<body>
  <header class="header">
    <div class="logo">
      <h1>Science<span>Craft</span></h1>
    </div>

    <nav class="menu">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="simulador.html">Simulador</a></li>
        <li><a href="sobre.html">Sobre</a></li>

      </ul>

  <section class="container">
    <div class="div_form">
      <label for="ipt_nome">Nome:</label>
      <input type="text" id="ipt_nome" value="kaio rocha">

      <label for="ipt_email">Email:</label>
      <input type="email" id="ipt_email" value="kaio.rocha@sptech.school">


      <label for="ipt_dtNasc">Data de nascimento:</label>
      <input type="date" id="ipt_dtNasc" value="2005-04-14">


      <label for="ipt_senha">Senha:</label>
      <input type="password" id="ipt_senha" value="senha123">

      <label for="ipt_senha2">Confirmar senha:</label>
      <input type="password" id="ipt_senha2" value="senha123">

      <label for="ipt_codigo">Codigo de convite:</label>
      <input type="text" id="ipt_codigo" value="10">

      <button onclick="cadastrar()">Cadastrar</button>
      <div class="message" id="msg"></div>
    </div>
    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
      <div id="div_aguardar" class="loading-div">

      </div>
    </div>

<script>
  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = ipt_nome.value;
    var emailVar = ipt_email.value;
    var dtNascVar = ipt_dtNasc.value
    var senhaVar = ipt_senha.value;
    var confirmacaoSenhaVar = ipt_senha2.value;
    var conviteVar = ipt_codigo.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      dtNascVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      conviteVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        dtNascServer: dtNascVar,
        conviteServer: conviteVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }


  function sumirMensagem() {
    cardErro.style.display = "none";
  }

</script>
