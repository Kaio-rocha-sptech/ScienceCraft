<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScienceCraft | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/styleDashboard.css">
    <script src="js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body onload="carregarDashboard()">

    <header class="header">
        <div class="logo">
            <h1>Science<span>Craft</span></h1>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="loginFeito.html">Publicações   </a></li>
            </ul>
        </nav>
    </header>

    <h2>Seu código de convite: <span id="idConvite"></span></h2>

    <section id="sessao_meusConvites" class="sessaoGraficos">
        <h2>Convites utilizados</h2>
        <div id="contadorConvites">0</div>
    </section>

    <section class="container">
        <div class="cardGrafico">
            <h3>Total de Convites por Usuário</h3>
            <canvas id="graficoRankingTotal"></canvas>
        </div>
    </section>

</body>
</html>

<script>
idConvite.innerHTML = sessionStorage.ID_USUARIO;

let chartRankingTotal;
let intervaloAtualizacao;

function carregarDashboard() {
    atualizarDashboard();
    intervaloAtualizacao = setInterval(atualizarDashboard, 3000);
}

function atualizarDashboard() {
    let idUsuario = sessionStorage.ID_USUARIO;

    // === Contador de convites do usuário ===
    fetch(`/convites/quantidade/${idUsuario}`, { cache: 'no-store' })
        .then(res => res.json())
        .then(dados => {
            let total = 0;
            if (Array.isArray(dados) && dados.length > 0) {
                total = dados[0].total;
            }
            document.getElementById("contadorConvites").innerText = total;
        })
        .catch(err => console.error("Erro ao obter convites do usuário:", err));

    // === Ranking total ===
    fetch('/convites/ranking/total')
        .then(res => res.json())
        .then(dados => {
            if (!Array.isArray(dados)) dados = [];
            let labels = dados.map(u => u.nome);
            let valores = dados.map(u => u.totalConvites);

            if (!chartRankingTotal) {
                chartRankingTotal = new Chart(document.getElementById('graficoRankingTotal'), {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'Total de Convites',
                    data: valores,
                    backgroundColor: '#00ffff',
                    borderWidth: 2 }] 
                    },
                    options: { scales: { y: { beginAtZero: true } } }
                });
            } else {
                chartRankingTotal.data.labels = labels;
                chartRankingTotal.data.datasets[0].data = valores;
                chartRankingTotal.update();
            }
        })
        .catch(err => console.error("Erro ao obter ranking total:", err));
}
</script>
