<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScienceCraft | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/styleDashboard.css">
    <script src="js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="carregarDashboard()">

    <header class="header">
        <div class="logo">
            <h1>Science<span>Craft</span></h1>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="loginFeito.html">Publicações </a></li>
            </ul>
        </nav>
    </header>

    <h2>Seu código de convite: <span id="idConvite"></span></h2>

    <section id="sessao_meusConvites" class="sessaoGraficos">
        <h2>Convites utilizados</h2>
        <div id="contadorConvites">0</div>
    </section>

    <section class="container">
        <div class="cardGrafico">
            <h3>Usuarios com maior numero de convites</h3>
            <canvas id="graficoRankingTotal"></canvas>
        </div>
    </section>

</body>

</html>
<script>
    idConvite.innerHTML = sessionStorage.ID_USUARIO;

    let graficoRankingTotal = null;
    let intervaloDeAtualizacao = null;

    function carregarDashboard() {
        atualizarDashboard();
        intervaloDeAtualizacao = setInterval(atualizarDashboard, 3000);
    }

    function atualizarDashboard() {

        let idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/convites/quantidade/${idUsuario}`, { cache: 'no-store' })
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (listaDeDados) {

                let totalConvites = 0;

                // Se vier algo na lista, pega o primeiro item
                if (Array.isArray(listaDeDados) && listaDeDados.length > 0) {
                    totalConvites = listaDeDados[0].total;
                }

                document.getElementById("contadorConvites").innerText = totalConvites;
            })
            .catch(function (erro) {
                console.error("Erro ao obter convites do usuário:", erro);
            });

        fetch('/convites/ranking/total')
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (listaDeUsuarios) {
                if (!Array.isArray(listaDeUsuarios)) {
                    listaDeUsuarios = [];
                }
                let vetorNomes = [];
                let vetorQuantidades = [];
                for (let i = 0; i < listaDeUsuarios.length; i++) {
                    let usuarioAtual = listaDeUsuarios[i];

                    vetorNomes.push(usuarioAtual.nome);
                    vetorQuantidades.push(usuarioAtual.totalConvites);
                }

                if (graficoRankingTotal == null) {
                    graficoRankingTotal = new Chart(
                        document.getElementById('graficoRankingTotal'),
                        {
                            type: 'bar',
                            data: {
                                labels: vetorNomes,
                                datasets: [{
                                    label: 'Total de Convites',
                                    data: vetorQuantidades,
                                    backgroundColor: '#00ffff',
                                    borderWidth: 2
                                }]
                            },
                            options: {
                                scales: {
                                    y: { beginAtZero: true }
                                }
                            }
                        }
                    );

                } else {
                    graficoRankingTotal.data.labels = vetorNomes;
                    graficoRankingTotal.data.datasets[0].data = vetorQuantidades;
                    graficoRankingTotal.update();
                }
            })
            .catch(function (erro) {
                console.error("Erro ao obter ranking total:", erro);
            });

    }
</script>
